name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain information
        run: |
          swift --version
          xcodebuild -version
          xcode-select -p
      - name: Test
        run: ./Scripts/test.sh
      - name: Build app bundle
        run: ./Scripts/build-app.sh
      - name: Verify bundle
        run: build/Hexa.app/Contents/MacOS/Hexa --verify-bundle
